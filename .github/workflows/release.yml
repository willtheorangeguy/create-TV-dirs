name: Publish to PyPI, Docker Hub, and Create Executable

on:
  release:
    types: [published] # Trigger on new releases being published

permissions:
  contents: write
  id-token: write

jobs:
  pypi-publish:
    name: Build and publish Python package to PyPI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.9"

    - name: Install build dependencies
      run: python -m pip install build

    - name: Build package
      run: python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip_existing: true

  docker-publish:
    name: Build and publish Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: pypi-publish

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/tv-show-organizer

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: pypi-publish

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.9"

    - name: Install project from source
      run: pip install .

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build the executable
      run: pyinstaller --name tv-organizer --onefile --windowed tv_organizer/__main__.py

    - name: Upload executable to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/tv-organizer.exe
        asset_name: tv-organizer-windows.exe
        asset_content_type: application/vnd.microsoft.portable-executable
